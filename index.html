<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1236">
<title>Congreso de Juventudes La Costa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1236;--blue:#1a7bd0;--pink:#ff4f9a;--ink:#fff;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--navy);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overscroll-behavior:none}
.display{font-family:'Lilita One','Arial Rounded MT Bold','Arial Black',sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.05}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;touch-action:pan-y;scrollbar-width:none;user-select:none;-webkit-user-select:none}
#feed::-webkit-scrollbar{display:none}
#feed.locked{overflow:hidden}
.slide{--ac:var(--blue);height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 28px) 26px calc(var(--sb) + 92px);background:var(--navy);background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 55%,var(--navy)) 0%,var(--navy) 88%)}
.slide::before{content:'';position:absolute;width:80vmax;height:80vmax;right:-42vmax;top:-34vmax;border-radius:50%;background:var(--ac);opacity:.3}
.slide::after{content:'';position:absolute;width:34vmax;height:34vmax;left:-18vmax;bottom:-14vmax;border-radius:50%;background:var(--pink);opacity:.22}
.in{position:relative;z-index:1;width:min(100%,560px);margin:0 auto}
.kicker{font-weight:800;font-size:1rem;opacity:.85;margin-bottom:12px}
.slide h2{font-size:clamp(2rem,9.5vw,3.3rem);text-shadow:0 3px 0 rgba(0,0,0,.35);margin-bottom:16px}
.teaser{font-size:1.08rem;line-height:1.5;opacity:.92;max-width:34ch}
.salon{display:inline-block;margin-top:22px;padding:8px 16px;border-radius:99px;background:#fff;color:var(--navy);font-weight:800}
.enter{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 26px);display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);font-weight:800;white-space:nowrap}
.enter svg{width:22px;height:22px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-7px)}}

/* portada */
.hero{--ac:var(--blue);align-items:center;text-align:center}
.hero .in{display:flex;flex-direction:column;align-items:center}
.hero img.logo{width:min(78vw,340px);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.hero h1{font-size:clamp(2rem,10vw,3.2rem);margin:18px 0 10px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hero .teaser{margin:0 auto}
.date{margin-top:20px;padding:9px 18px;border-radius:99px;background:var(--pink);font-weight:800}
.hero .org{position:absolute;z-index:1;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 84px);width:min(62vw,250px)}
.down{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 22px);display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.95rem}
.down svg{width:28px;height:28px;animation:bob 1.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.bigdate{font-size:clamp(4rem,24vw,7rem);line-height:.9;margin-bottom:10px;-webkit-text-stroke:3px #fff;color:transparent;text-shadow:5px 5px 0 var(--pink)}

/* puntos */
#dots{position:fixed;z-index:10;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
#dots button{width:22px;height:22px;display:grid;place-items:center}
#dots i{display:block;width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.4);transition:.25s}
#dots button.on i{height:22px;background:#fff}

/* detalle */
#detail{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--navy);transform:translateX(100%);visibility:hidden;transition:transform .38s cubic-bezier(.3,.8,.3,1),visibility 0s .38s;touch-action:pan-y pinch-zoom;overscroll-behavior:contain;user-select:none;-webkit-user-select:none}
#detail.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.3,.8,.3,1)}
.bar{position:sticky;top:0;height:0;z-index:5}
.back{position:absolute;left:14px;top:calc(var(--st) + 12px);display:flex;align-items:center;gap:6px;padding:9px 16px 9px 10px;border-radius:99px;background:rgba(13,18,54,.7);backdrop-filter:blur(8px);font-weight:800}
.back svg{width:20px;height:20px}
.dh{--ac:var(--blue);padding:calc(var(--st) + 76px) 24px 34px;background:linear-gradient(165deg,var(--ac),color-mix(in srgb,var(--ac) 30%,var(--navy)));border-radius:0 0 36px 36px}
.dh h2{font-size:clamp(2rem,9vw,3rem);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.dh .salon{margin-top:16px}
.wrap{width:min(100%,560px);margin:0 auto}
.db{padding:28px 24px 8px}
.db section{margin-bottom:34px}
.db h3{font-size:1.5rem;margin-bottom:14px;color:#fff}
.db p{line-height:1.6;margin-bottom:10px;color:#dfe4ff}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips span{padding:9px 15px;border-radius:99px;font-weight:700;background:color-mix(in srgb,var(--ac) 60%,var(--navy));border:2px solid var(--ac)}
.list{list-style:none;display:grid;gap:12px}
.list li{position:relative;padding-left:34px;line-height:1.5;color:#dfe4ff}
.list li::before{content:'';position:absolute;left:4px;top:.35em;width:14px;height:14px;border-radius:50%;background:var(--c,var(--pink));box-shadow:0 0 0 4px rgba(255,255,255,.1)}
.qs li{counter-increment:q}
.qs li::before{content:counter(q);width:22px;height:22px;left:0;top:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--navy);background:#fff;box-shadow:none}
.qs{counter-reset:q}
.time{display:grid;gap:10px}
.time div{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.08)}
.time b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:1.05rem;color:#fff;background:var(--blue);padding:7px 0;border-radius:99px;text-align:center}
.time span{font-weight:700;line-height:1.3}
.cta{display:block;text-align:center;margin:0 0 20px;padding:15px;border-radius:99px;background:var(--pink);font-weight:800;text-decoration:none;color:#fff}
.foot{padding:10px 24px calc(var(--sb) + 40px);text-align:center;color:#aab3e6;font-size:.95rem}
.foot img{width:200px;max-width:70%;margin:0 auto 18px;display:block}
.foot .lead{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:800;margin-top:6px;color:#fff}
.foot svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
.hero img.logo{width:min(84vw,380px)}
.enter{max-width:88vw;white-space:normal;text-align:center;line-height:1.2;font-size:.95rem}
@keyframes nudge{50%{transform:translateX(7px)}}
.cron{display:grid;gap:9px;margin-top:18px}
.cron div{display:grid;grid-template-columns:116px 1fr;gap:8px}
.cron b{display:grid;place-items:center;background:#5170ff;border-radius:99px;font-family:'Lilita One',sans-serif;font-weight:400;font-size:.95rem;padding:10px 0}
.cron span{display:flex;align-items:center;background:#fff;color:var(--navy);font-weight:800;border-radius:22px;padding:8px 14px;font-size:.86rem;line-height:1.25}
.plano{display:block;width:100%;max-height:62dvh;object-fit:contain;background:#fff;border-radius:18px;padding:6px;margin-top:14px}
.db .plano{max-height:none;margin-top:0}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:15px 26px;border-radius:99px;background:#fff;color:var(--navy);font-weight:800;font-size:1.05rem;text-decoration:none;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn svg{width:24px;height:24px}
.mapbox{position:relative;height:340px;border-radius:22px;overflow:hidden;background:#222}
.mapbox iframe{width:100%;height:100%;border:0;pointer-events:none}
.mapbox.on iframe{pointer-events:auto}
.mapbox span{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(13,18,54,.85);padding:6px 14px;border-radius:99px;font-size:.85rem;font-weight:700;white-space:nowrap}
.mapbox.on span{display:none}
.planobox{position:relative;cursor:zoom-in;margin-top:14px}
.planobox .plano{margin-top:0}
.zoomtag{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(13,18,54,.88);color:#fff;font-size:.82rem;font-weight:800}
.zoomtag svg{width:16px;height:16px}
.last{padding-bottom:calc(var(--sb) + 200px)}
.end{position:absolute;z-index:2;left:0;right:0;bottom:calc(var(--sb) + 18px);display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 24px;text-align:center}
.end .btn{margin-top:0;padding:11px 22px;font-size:.95rem}
.end img{width:min(56vw,220px)}
.end p{font-size:.82rem;opacity:.85}
.foot .btn{margin:0 auto 26px}
#zoom{position:fixed;inset:0;z-index:40;background:rgba(8,10,30,.97);display:none;align-items:center;justify-content:center;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#zoom.on{display:flex}
#zimg{max-width:96vw;max-height:88dvh;background:#fff;border-radius:10px;transform-origin:center;will-change:transform;pointer-events:none}
#zclose{position:absolute;top:calc(var(--st) + 12px);right:14px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
#zclose svg{width:22px;height:22px}
.zbtns{position:absolute;right:14px;bottom:calc(var(--sb) + 22px);display:grid;gap:10px}
.zbtns button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);font-size:1.6rem;font-weight:800;line-height:1}
.zhint{position:absolute;left:16px;bottom:calc(var(--sb) + 30px);max-width:60vw;font-size:.9rem;font-weight:700;opacity:.85;transition:opacity .6s}
.zhint.off{opacity:0}
</style>
</head>
<body>
<main id="feed" tabindex="-1" aria-label="Secciones del congreso"></main>
<nav id="dots" aria-label="Ir a la sección"></nav>
<aside id="detail" aria-hidden="true">
  <div class="bar"><button class="back" id="back" aria-label="Volver a las categorías"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Volver</button></div>
  <div id="detailBody"></div>
</aside>

<div id="zoom" aria-hidden="true" role="dialog" aria-label="Plano ampliado"><img id="zimg" alt="Plano del espacio ampliado" draggable="false">
 <button id="zclose" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
 <p class="zhint" id="zhint">Pellizca o toca dos veces para hacer zoom</p>
 <div class="zbtns"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">&minus;</button></div></div>

const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSf1zrrx3b3Y5yfXAN5M3troewPFnCY7Rh5QdgQOcSnyYXDo6w/viewform';
const IG_URL='https://www.instagram.com/dirpoliticassociales.lacosta/';
const CRON=[['10:00 - 10:30','Acreditación'],['10:30 - 11:00','Desayuno'],['11:00 - 13:00','Intercambio en las comisiones de los ejes temáticos'],['13:00 - 14:30','Break / almuerzo / DJ. Recorrido de stands institucionales'],['14:30 - 15:00','Puesta en común, reflexión y cierre']];
const SALONES=[['#3aaaf0','Salón 1','Ciudadanía digital, tecnologías y redes sociales'],['#ff3d9a','Salón 2','Salud integral, ESI, políticas de cuidado y discapacidad'],['#3d6a99','Salón 3','Ambiente y sustentabilidad'],['#ef4a7b','Salón 4','Cultura y deportes'],['#5b6cf0','Salón 5','Educación, empleo y ciudadanía']];
const q=encodeURIComponent(LUGAR);
const lupa='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 8v5M8 10.5h5"/></svg>';
const plano=alt=>`<div class="planobox" role="button" tabindex="0" aria-label="Ampliar el plano"><img class="plano" src="${IMG.mapa}" alt="${alt}"><span class="zoomtag">${lupa}Toca para ampliar</span></div>`;
const $=s=>document.querySelector(s);
const feed=$('#feed'),detail=$('#detail'),body=$('#detailBody'),dots=$('#dots');
const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
const igIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8" fill="currentColor"/></svg>';
let cur=0,openIdx=null;

const SLIDES=[
 {id:'inicio',hero:true},
 {id:'cronograma',c:'#5170ff',hint:'Desliza a la izquierda para ver cómo llegar',
  slide:()=>`<h2 class="display">Cronograma</h2><p class="teaser">Congreso Juventudes. Sábado 14 de noviembre en el Multicultural de Mar de Ajó.</p><div class="cron">${CRON.map(r=>`<div><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>`,
  detail:()=>`<header class="dh" style="--ac:#5170ff"><div class="wrap"><h2 class="display">¿Cómo llegar?</h2><p class="teaser" style="margin-top:10px">${LUGAR}</p></div></header>
   <div class="db wrap"><section><div class="mapbox" onclick="this.classList.add('on')"><iframe src="https://www.google.com/maps?q=${q}&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa de Google Maps"></iframe><span>Toca el mapa para moverlo</span></div><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Abrir en Google Maps</a></section></div>`},
 {id:'mapa',c:'#ff3d9a',hint:'Desliza a la izquierda para ver los salones',
  slide:()=>`<h2 class="display">Mapa del espacio</h2>${plano('Plano del espacio con el escenario, la acreditación y los salones 1 a 5')}`,
  detail:()=>`<header class="dh" style="--ac:#ff3d9a"><div class="wrap"><h2 class="display">Mapa del espacio</h2></div></header>
   <div class="db wrap"><section><h3 class="display">Salones</h3><ul class="list">${SALONES.map(s=>`<li style="--c:${s[0]}"><b>${s[1]}:</b> ${s[2]}</li>`).join('')}</ul><p style="margin-top:12px">La acreditación y el escenario están en el hall central.</p></section><section>${plano('Plano del espacio')}</section></div>`},
 {id:'foto',c:'#3aaaf0',
  slide:()=>`<h2 class="display">Subí tu foto</h2><p class="teaser">Compartí tu foto del congreso con nosotros completando este formulario.</p><a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Subir mi foto</a>`},
 {id:'redes',c:'#ff4f9a',
  slide:()=>`<h2 class="display">Seguinos en nuestras redes</h2><p class="teaser">Enterate de las novedades y actividades de Políticas Sociales de La Costa.</p><a class="btn" href="${IG_URL}" target="_blank" rel="noopener">${igIcon}Ir a Instagram</a>`,end:true}
];

feed.innerHTML=SLIDES.map((s,i)=>s.hero?`
<section class="slide hero" data-i="${i}"><div class="in">
 <img class="logo" src="${IMG.juv}" alt="Juventudes">
 <h1 class="display">Congreso Juventudes 2026</h1>
 <p class="teaser">Un día para escuchar tu voz y construir las políticas públicas de La Costa.</p>
 <span class="date">Sábado 14 de noviembre, 10 a 15 hs</span></div>
 <img class="org" src="${IMG.blanco}" alt="Secretaría de Desarrollo Humano, Cultura y Comunidad. Municipalidad de La Costa">
 <div class="down">Desliza para continuar${chev}<path d="M6 9l6 6 6-6"/></svg></div>
</section>`:`
<section class="slide${s.end?' last':''}" data-i="${i}" style="--ac:${s.c}"><div class="in">${s.slide()}</div>${s.end?`<div class="end"><button class="btn" data-top>${chev}<path d="M12 19V5M6 11l6-6 6 6"/></svg>Volver al inicio</button><img src="${IMG.blanco}" alt="Secretaría de Desarrollo Humano, Cultura y Comunidad. Municipalidad de La Costa"><p>Dirección de Políticas Sociales. Municipalidad de La Costa.</p></div>`:''}
 ${s.detail?`<button class="enter" data-open="${i}">${s.hint}${chev}<path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`:''}
</section>`).join('');

dots.innerHTML=SLIDES.map((s,i)=>`<button data-go="${i}" aria-label="Ir a la sección ${i+1}"><i></i></button>`).join('');
dots.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)feed.scrollTo({top:b.dataset.go*feed.clientHeight,behavior:'smooth'})});
feed.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openDetail(+b.dataset.open);if(e.target.closest('[data-top]'))feed.scrollTo({top:0,behavior:'smooth'})});
function setCur(i){cur=i;[...dots.children].forEach((b,j)=>b.classList.toggle('on',j===i))}
{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setCur(+e.target.dataset.i)}),{root:feed,threshold:.6});feed.querySelectorAll('.slide').forEach(s=>io.observe(s))}
setCur(0);

function renderDetail(s){return `${s.detail()}<footer class="foot wrap"><button class="btn" data-close>${chev}<path d="M15 5l-7 7 7 7"/></svg>Volver</button><img src="${IMG.blanco}" alt="Municipalidad de La Costa"><p>Secretaría de Desarrollo Humano, Cultura y Comunidad. Municipalidad de La Costa.</p><p class="lead">Desliza a la derecha para volver${chev}<path d="M9 5l7 7-7 7"/></svg></p></footer>`}
function show(i){openIdx=i;body.innerHTML=renderDetail(SLIDES[i]);detail.scrollTop=0;detail.classList.add('open');detail.setAttribute('aria-hidden','false');feed.classList.add('locked');$('#back').focus({preventScroll:true})}
function hide(){closeZoom();openIdx=null;detail.classList.remove('open');detail.setAttribute('aria-hidden','true');feed.classList.remove('locked')}
function openDetail(i){if(!SLIDES[i].detail||openIdx!==null)return;history.pushState({i},'','#'+SLIDES[i].id);show(i)}
function closeDetail(){if(openIdx===null)return;if(history.state&&history.state.i!=null)history.back();else{hide();history.replaceState(null,'',location.pathname+location.search)}}
function fromHash(){const i=SLIDES.findIndex(s=>s.id===location.hash.slice(1));if(i>0&&SLIDES[i].detail){feed.scrollTo({top:i*feed.clientHeight});show(i)}else hide()}
addEventListener('popstate',fromHash);
$('#back').addEventListener('click',closeDetail);
body.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeDetail()});

// Gestos: izquierda = entrar, derecha = volver. El scroll vertical lo maneja el navegador.
function swipe(el,onRight,onLeft){
 let x,y;
 el.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY});
 el.addEventListener('pointerup',e=>{if(x==null)return;const dx=e.clientX-x,dy=e.clientY-y;x=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)(dx>0?onRight:onLeft)()});
 el.addEventListener('pointercancel',()=>{x=null});
}
swipe(feed,()=>{},()=>openDetail(cur));
swipe(detail,closeDetail,()=>{});
addEventListener('keydown',e=>{
 if(zoomEl.classList.contains('on')){if(e.key==='Escape')closeZoom();return}
 if(e.key==='Enter'&&document.activeElement.classList.contains('planobox'))openZoom();
 else if(e.key==='ArrowLeft')openDetail(cur);
 else if(e.key==='ArrowRight'||e.key==='Escape')closeDetail();
 else if(openIdx===null&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();feed.scrollBy({top:(e.key==='ArrowDown'?1:-1)*feed.clientHeight,behavior:'smooth'})}
});
// Visor del plano: pellizco, arrastre, doble toque, rueda y botones.
const zoomEl=$('#zoom'),zimg=$('#zimg'),zhint=$('#zhint');zimg.src=IMG.mapa;
let sc=1,tx=0,ty=0,moved=0,lastTap=0;const P=new Map();
const apply=()=>{zimg.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`};
function clampT(){const mx=Math.max(0,(zimg.offsetWidth*sc-innerWidth)/2),my=Math.max(0,(zimg.offsetHeight*sc-innerHeight)/2);tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty))}
function zoomAt(cx,cy,r){const n=Math.max(1,Math.min(6,sc*r));r=n/sc;const px=cx-innerWidth/2,py=cy-innerHeight/2;tx=px-(px-tx)*r;ty=py-(py-ty)*r;sc=n;clampT();apply();zhint.classList.add('off')}
function openZoom(){zoomEl.classList.add('on');zoomEl.setAttribute('aria-hidden','false');sc=1;tx=ty=0;apply();zhint.classList.remove('off');setTimeout(()=>zhint.classList.add('off'),3500)}
function closeZoom(){zoomEl.classList.remove('on');zoomEl.setAttribute('aria-hidden','true');P.clear()}
document.addEventListener('click',e=>{if(e.target.closest('.planobox'))openZoom()});
$('#zclose').addEventListener('click',closeZoom);
$('#zin').addEventListener('click',()=>zoomAt(innerWidth/2,innerHeight/2,1.6));
$('#zout').addEventListener('click',()=>zoomAt(innerWidth/2,innerHeight/2,1/1.6));
zoomEl.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;P.set(e.pointerId,[e.clientX,e.clientY]);zoomEl.setPointerCapture(e.pointerId);if(P.size===1)moved=0});
zoomEl.addEventListener('pointermove',e=>{
 const o=P.get(e.pointerId);if(!o)return;
 if(P.size===1){tx+=e.clientX-o[0];ty+=e.clientY-o[1];moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);P.set(e.pointerId,[e.clientX,e.clientY]);clampT();apply()}
 else if(P.size===2){const[a,b]=[...P.values()],pd=Math.hypot(a[0]-b[0],a[1]-b[1]),pm=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  P.set(e.pointerId,[e.clientX,e.clientY]);const[c,d]=[...P.values()],nd=Math.hypot(c[0]-d[0],c[1]-d[1]),nm=[(c[0]+d[0])/2,(c[1]+d[1])/2];
  tx+=nm[0]-pm[0];ty+=nm[1]-pm[1];moved+=20;zoomAt(nm[0],nm[1],nd/(pd||1))}
});
const up=e=>{if(!P.delete(e.pointerId))return;
 if(P.size===0&&moved<10&&e.type==='pointerup'){const now=Date.now();
  if(now-lastTap<320){if(sc>1.05){sc=1;tx=ty=0;apply()}else zoomAt(e.clientX,e.clientY,2.5);lastTap=0}else lastTap=now}};
zoomEl.addEventListener('pointerup',up);zoomEl.addEventListener('pointercancel',up);
zoomEl.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.2:1/1.2)},{passive:false});
if(location.hash)fromHash();
</script>
</body>
</html>
